[project]
name = "football-pipeline"
version = "0.1.0"
description = "Football analytics ELT pipeline demo using Impect open data."
requires-python = ">=3.11"
dependencies = [
  "api",
  "ingestion",
  "dashboard",
  "orchestration",    # Dagster assets
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
api = { workspace = true }
ingestion = { workspace = true }
orchestration = { workspace = true }
dashboard = { workspace = true }

[tool.uv.workspace]
members = [
  "api",
  "ingestion",
  "dashboard",
  "orchestration",
]

[tool.dg]
directory_type = "workspace"

[tool.dg.workspace]
projects = [{ path = "orchestration" }]

[dependency-groups]
dev = [
  "ruff>=0.14",
  "basedpyright>=1.31",
]

[tool.ruff]
src = ["api/src", "ingestion/src"]

[tool.basedpyright]
include = ["api/src", "ingestion/src"]
typeCheckingMode = "standard"
