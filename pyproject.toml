[project]
name = "football-pipeline"
version = "0.1.0"
description = "Football analytics ELT pipeline demo using Impect open data."
requires-python = ">=3.11"
dependencies = [
  "api",
  "ingestion",
  # "orchestration",      # Dagster assets (to be scaffolded)
  # "dashboard-backend",  # dashboard FastAPI backend (to be scaffolded)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
api = { workspace = true }
ingestion = { workspace = true }
# orchestration = { workspace = true }
# dashboard-backend = { workspace = true }

[tool.uv.workspace]
members = [
  "api",
  "ingestion",
  # "orchestration",
  # "dashboard-backend",
]

[dependency-groups]
dev = [
  "ruff>=0.14",
  "basedpyright>=1.31",
]

[tool.ruff]
src = ["api/src", "ingestion/src"]

[tool.basedpyright]
include = ["api/src", "ingestion/src"]
typeCheckingMode = "standard"
