version: 2

models:
  - name: player_match_metrics
    description: >
      Custom headline metric: Pass Success % per player per match.
      Computed from event data (result = 'SUCCESS' on PASS events), not from
      vendor KPI aggregates. Grain: one row per player per match.
    config:
      materialized: table
      schema: marts
      tags: [marts]
    columns:
      - name: match_id
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: pass_success_pct
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [player_id, match_id]
