[project]
name = "dashboard"
version = "0.1.0"
description = "Streamlit dashboard reading from the DuckDB warehouse."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "plotly>=5",
    "pandas>=2",
    "streamlit>=1.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
