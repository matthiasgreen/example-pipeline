[project]
name = "api"
version = "0.1.0"
description = "Mock Impect API — FastAPI wrapper serving the Impect open-data JSON with Swagger UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
