[project]
name = "ingestion"
version = "0.1.0"
description = "dlt ingestion — extracts the Impect data from the mock API and loads it into DuckDB"
requires-python = ">=3.11"
dependencies = [
    "dlt[duckdb]>=1.4",
    "httpx>=0.28",
]

[project.scripts]
ingestion = "ingestion.run:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
